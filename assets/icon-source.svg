<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#3b1d93"/>
      <stop offset="0.5" stop-color="#160a47"/>
      <stop offset="1" stop-color="#05030f"/>
    </radialGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ff3ff"/>
      <stop offset="0.5" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#ff6fc4"/>
    </linearGradient>
    <radialGradient id="moon" cx="40%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.55" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8f6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="512" cy="512" r="112" fill="white"/>
      <circle cx="566" cy="472" r="98" fill="black"/>
    </mask>
    <clipPath id="eye">
      <path d="M150 512 Q512 122 874 512 Q512 902 150 512 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="512" r="420" fill="url(#halo)"/>
  <g transform="translate(0 34)">

  <!-- the three agents sharing one dream -->
  <g fill="#fff" filter="url(#glow)">
    <path d="M512 92 L527 137 L572 152 L527 167 L512 212 L497 167 L452 152 L497 137 Z"/>
    <path d="M214 248 L224 276 L252 286 L224 296 L214 324 L204 296 L176 286 L204 276 Z" opacity="0.9"/>
    <path d="M810 248 L820 276 L848 286 L820 296 L810 324 L800 296 L772 286 L800 276 Z" opacity="0.9"/>
  </g>
  <g fill="#cfc3ff" opacity="0.7">
    <circle cx="150" cy="760" r="6"/><circle cx="880" cy="740" r="7"/>
    <circle cx="300" cy="880" r="5"/><circle cx="740" cy="890" r="5"/>
    <circle cx="120" cy="470" r="4"/><circle cx="910" cy="450" r="4"/>
  </g>

  <!-- eye: dark iris well, then the crescent-moon pupil, then the glowing lid -->
  <g clip-path="url(#eye)">
    <circle cx="512" cy="512" r="168" fill="#0b0626"/>
    <circle cx="512" cy="512" r="168" fill="none" stroke="url(#lid)" stroke-width="10" opacity="0.55"/>
  </g>
  <g filter="url(#glow)">
    <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
  </g>
  <path d="M150 512 Q512 122 874 512 Q512 902 150 512 Z" fill="none" stroke="url(#lid)"
        stroke-width="40" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>
